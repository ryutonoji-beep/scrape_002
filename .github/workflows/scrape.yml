name: Scraper Workflow

on:
  repository_dispatch:
    types: [start_scraping] # GASからキックされるイベント名

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Create input.json from Payload
        # GASから渡されたJSONデータを動的に生成 (リポジトリは汚れない)
        run: echo '${{ toJSON(github.event.client_payload.items) }}' > input.json

      - name: Install Dependencies
        run: npm install

      - name: Run Scraper
        run: node scraper.js

      - name: Upload Result Artifact
        # コミットする代わりに、Artifact（成果物）としてZIPで一時保存
        uses: actions/upload-artifact@v4
        with:
          name: result-data
          path: result.json
          retention-days: 1 # 1日経つとGitHubから自動で消去される
